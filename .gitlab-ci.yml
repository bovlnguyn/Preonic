stages:
  - install
  - build
  - test

variables:
  NODE_VERSION: "20"

# ════════════════════════════════════════
# Cache node_modules để build nhanh hơn
# ════════════════════════════════════════
.cache_be: &cache_be
  cache:
    key: be-node-modules
    paths:
      - be/node_modules/

.cache_fe: &cache_fe
  cache:
    key: fe-node-modules
    paths:
      - fe/node_modules/

# ════════════════════════════════════════
# BACKEND
# ════════════════════════════════════════
be:install:
  stage: install
  image: node:${NODE_VERSION}
  <<: *cache_be
  script:
    - cd be
    - npm ci
  artifacts:
    paths:
      - be/node_modules/
    expire_in: 1 hour

be:build:
  stage: build
  image: node:${NODE_VERSION}
  <<: *cache_be
  needs: ["be:install"]
  script:
    - cd be
    - npm run build
  artifacts:
    paths:
      - be/dist/
    expire_in: 1 hour

be:test:
  stage: test
  image: node:${NODE_VERSION}
  <<: *cache_be
  needs: ["be:install"]
  script:
    - cd be
    - npm run lint || echo "Lint warnings found (non-blocking for now)"
    # - npm test   # bỏ comment khi có test thật

# ════════════════════════════════════════
# FRONTEND
# ════════════════════════════════════════
fe:install:
  stage: install
  image: node:${NODE_VERSION}
  <<: *cache_fe
  script:
    - cd fe
    - npm ci
  artifacts:
    paths:
      - fe/node_modules/
    expire_in: 1 hour

fe:build:
  stage: build
  image: node:${NODE_VERSION}
  <<: *cache_fe
  needs: ["fe:install"]
  script:
    - cd fe
    - npm run build
  artifacts:
    paths:
      - fe/build/
    expire_in: 1 hour

fe:test:
  stage: test
  image: node:${NODE_VERSION}
  <<: *cache_fe
  needs: ["fe:install"]
  script:
    - cd fe
    - npm test -- --watchAll=false || echo "No tests found yet (non-blocking for now)"